<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bungee&family=Fredoka:wght@500;600;700&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ CARTOON ENGINE ============ */
:root{
  --ink:#14121a; --paper:#fff; --text:#fff; --ptext:#14121a; --muted:rgba(255,255,255,.75); --pmuted:#6b6878;
  --c1:#ffd23f; --c2:#ff4f9a; --c3:#7c3aed; --btnText:#14121a;
  --head:"Lilita One","Fredoka",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
  --bgimg:linear-gradient(180deg,#6d28d9,#3b0d8a); --pattern:none; --patsize:auto;
  --hard:0 5px 0 var(--ink); --hard-sm:0 3px 0 var(--ink);
  /* legacy aliases used by game css */
  --glass:var(--paper); --line:var(--ink); --display:var(--head);
  --pink:#ff4f9a; --violet:#7c5cff; --cyan:#22d3ee; --gold:#ffd23f; --green:#22c55e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{background:var(--ink)}
body{font-family:var(--body);font-weight:800;color:var(--text);-webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;display:flex;flex-direction:column;padding:var(--safe-t) 0 var(--safe-b);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
img{-webkit-user-drag:none;user-select:none}

/* outlined image helper (cartoon ink outline) */
.outl{filter:drop-shadow(2.5px 0 0 var(--ink)) drop-shadow(-2.5px 0 0 var(--ink)) drop-shadow(0 2.5px 0 var(--ink)) drop-shadow(0 -2.5px 0 var(--ink)) drop-shadow(0 5px 0 rgba(0,0,0,.25))}
/* stroked cartoon text */
.stroke{color:var(--c1);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}

/* background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bgimg)}
.bg .pat{position:absolute;inset:-50%;background:var(--pattern);background-size:var(--patsize);opacity:var(--patop,.5);animation:pr-pat 40s linear infinite}
@keyframes pr-pat{to{transform:translate(10%,10%)}}
.bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.28))}
@keyframes pr-rot{to{transform:rotate(360deg)}}
@keyframes pr-fade{from{opacity:0}}

/* strip */
.strip{flex:none;overflow:hidden;white-space:nowrap;background:var(--ink);color:var(--c1);
  font:400 13px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;padding:8px 0}
.strip .track{display:inline-block;animation:pr-marquee 26s linear infinite}
.strip span{margin:0 12px} .strip b{color:#fff;font-weight:400}
@keyframes pr-marquee{to{transform:translateX(-50%)}}

.app{flex:1;min-height:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 10px;gap:clamp(6px,1.2vh,12px)}

/* topbar */
.topbar{flex:none;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--paper);color:var(--ptext);
  border:3px solid var(--ink);box-shadow:var(--hard-sm);font-size:12px;font-weight:900;white-space:nowrap}
.live i{width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid var(--ink);animation:pr-blink 1s steps(2) infinite}
@keyframes pr-blink{50%{background:#86efac}}
.topbar .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);color:var(--ptext);box-shadow:var(--hard-sm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:18px;height:18px}
.balance{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 3px;border-radius:999px;background:var(--paper);border:3px solid var(--ink);box-shadow:var(--hard-sm)}
.balance img{width:30px;height:30px}
.balance .val{font:400 19px/1 var(--head);color:var(--ptext);font-variant-numeric:tabular-nums;min-width:3ch;letter-spacing:.02em}
.balance.bump{animation:pr-bump .2s ease}
@keyframes pr-bump{50%{transform:scale(1.12) rotate(-3deg)}}

/* hero */
.hero{flex:none;text-align:center;position:relative}
.eyebrow{display:inline-block;font:400 12px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--c1);
  padding:5px 10px 4px;border:3px solid var(--ink);border-radius:9px;transform:rotate(-2deg);box-shadow:var(--hard-sm)}
.hero h1{font:400 clamp(34px,min(11vw,6vh),58px)/.95 var(--head);letter-spacing:.01em;margin-top:6px;
  color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.hero h1 em{font-style:normal;color:var(--c1);display:inline-block;transform:rotate(-3deg)}
body.compact .eyebrow{display:none}

/* game area */
.game{flex:1;min-height:0;position:relative;container-type:size}
#game-root{position:absolute;inset:0}

/* bottom HUD */
.bottom{flex:none;display:flex;flex-direction:column;gap:6px}
.hudrow{display:flex;gap:8px;align-items:stretch}
.timer{flex:none;display:none;align-items:center;gap:6px;padding:0 12px;border-radius:16px;background:var(--paper);color:var(--ptext);border:3px solid var(--ink);box-shadow:var(--hard-sm);
  font:400 22px/1 var(--head);font-variant-numeric:tabular-nums;min-width:86px;justify-content:center}
body.hastimer .timer{display:flex}
.timer svg{width:20px;height:20px}
.timer.hot{background:#ff3b3b;color:#fff;animation:pr-hot .5s ease-in-out infinite alternate}
@keyframes pr-hot{to{transform:scale(1.08) rotate(-3deg)}}
.goal{flex:1;padding:8px 12px 10px;border-radius:16px;background:var(--paper);color:var(--ptext);border:3px solid var(--ink);box-shadow:var(--hard-sm)}
.goal-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.goal-h span{font-size:12px;color:var(--pmuted);font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.goal-h b{font:400 15px/1 var(--head);font-variant-numeric:tabular-nums}
.goal-h b small{color:var(--pmuted);font-size:13px}
.bar{position:relative;height:16px;border-radius:99px;background:rgba(0,0,0,.12);border:3px solid var(--ink)}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:var(--c1);transition:width .2s ease;overflow:hidden}
.bar .fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);animation:pr-stripes .5s linear infinite}
.bar .fill::before{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
@keyframes pr-stripes{to{background-position:17px 0}}
.bar .mark{display:none}
.bar .chest-ico{position:absolute;right:-10px;top:50%;width:34px;transform:translateY(-60%)}
.bar .chest-ico.shake{animation:pr-cshake .35s ease}
@keyframes pr-cshake{25%{transform:translateY(-60%) rotate(-12deg)}75%{transform:translateY(-60%) rotate(12deg)}}
body.nogoal .goal{display:none}
body.nogoal.hastimer .hudrow{justify-content:center}
.ticker{height:22px;position:relative;overflow:hidden}
.tk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--text);animation:pr-tkIn .5s ease both;white-space:nowrap;font-weight:800}
.tk.out{animation:pr-tkOut .4s ease both}
.tk .dotav{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;border:2px solid var(--ink)}
.tk b{font-weight:900}
.tk .amt{display:inline-flex;align-items:center;gap:4px;font:400 13px var(--head);color:var(--c1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.tk .amt img{width:15px}
@keyframes pr-tkIn{from{opacity:0;transform:translateY(12px)}}
@keyframes pr-tkOut{to{opacity:0;transform:translateY(-12px)}}

/* buttons, chips, panels */
.cta{position:relative;display:block;width:100%;padding:15px 20px 13px;border:3px solid var(--ink);border-radius:18px;cursor:pointer;
  font:400 21px/1 var(--head);letter-spacing:.03em;text-transform:uppercase;color:var(--btnText);background:var(--c1);box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s}
.cta::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:5px;border-radius:9px;background:rgba(255,255,255,.45)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.cta:disabled{opacity:.55;cursor:default;transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.cta.alt{background:var(--c2);color:#fff}
.cta.shine{animation:pr-wiggle 2.4s ease-in-out infinite}
@keyframes pr-wiggle{0%,80%,100%{transform:none}85%{transform:rotate(-2deg) scale(1.03)}90%{transform:rotate(2deg) scale(1.03)}95%{transform:rotate(-1deg)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--paper);color:var(--ptext);border:3px solid var(--ink);box-shadow:var(--hard-sm);font-size:12.5px;font-weight:900}
.chip img{width:18px}
.chip b{font:400 15px/1 var(--head);color:var(--ptext)}
.panel{background:var(--paper);color:var(--ptext);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--hard)}
.glass{background:var(--paper);color:var(--ptext);border:3px solid var(--ink);box-shadow:var(--hard-sm)}
.hintline{font-size:14px;font-weight:900;color:var(--text);text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hintline b{color:var(--c1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:22px;z-index:6;transition:opacity .3s}
.start .card0{padding:18px 18px 20px;max-width:300px}
.start .card0 h4{font:400 26px/1 var(--head);margin-bottom:8px}
.start .card0 p{font-size:14px;line-height:1.4;color:var(--pmuted);margin-bottom:14px}
.start .card0 p b{color:var(--ptext)}

/* fx */
.pr-floater{position:fixed;z-index:30;pointer-events:none;font:400 26px/1 var(--head);color:var(--c1);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  text-shadow:0 3px 0 var(--ink);animation:pr-floatUp .9s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.pr-floater.big{font-size:36px}
@keyframes pr-floatUp{0%{transform:translate(-50%,-50%) scale(.4) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-90%) scale(1.15) rotate(4deg);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),-260%) scale(.9) rotate(0);opacity:0}}
.pr-spark{position:fixed;z-index:29;pointer-events:none;animation:pr-spark .7s cubic-bezier(.15,.7,.35,1) forwards}
@keyframes pr-spark{0%{transform:translate(-50%,-50%) scale(.4) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:0}}
.pr-star{position:fixed;z-index:28;pointer-events:none;width:16px;height:16px;background:var(--c1);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:pr-spark .6s ease-out forwards}
.pr-ripple{position:fixed;z-index:28;width:20px;height:20px;border-radius:50%;border:4px solid var(--ink);pointer-events:none;transform:translate(-50%,-50%);animation:pr-ripple .4s ease-out forwards}
@keyframes pr-ripple{to{width:130px;height:130px;opacity:0;border-width:1px}}
.pr-toast{position:absolute;left:50%;top:40%;z-index:20;pointer-events:none;white-space:nowrap;
  font:400 clamp(30px,10vw,46px)/1 var(--head);color:var(--c1);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);
  animation:pr-toast 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pr-toast{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:0}22%{transform:translate(-50%,-50%) scale(1.15) rotate(-5deg);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(.95) rotate(-4deg);opacity:0}}
.pr-shake{animation:pr-shakeA .35s ease}
@keyframes pr-shakeA{20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pr-flash{position:fixed;inset:0;z-index:27;pointer-events:none;background:#fff;animation:pr-fl .25s ease-out forwards}
@keyframes pr-fl{from{opacity:.55}to{opacity:0}}

/* win overlay */
.pr-overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--c2);overflow:hidden}
.pr-overlay.show{display:flex;animation:pr-fade .25s}
.pr-overlay .burst{position:absolute;width:170vmax;height:170vmax;border-radius:50%;background:repeating-conic-gradient(var(--c1) 0 9deg,transparent 9deg 22deg);opacity:.55;animation:pr-rot 18s linear infinite}
.pr-overlay .halo{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.6) 30%,transparent 65%)}
.pr-overlay .tag{position:relative;font:400 16px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--ink);padding:8px 16px 6px;border-radius:12px;transform:rotate(-3deg)}
.pr-overlay .win-h{position:relative;margin-top:14px;text-align:center;font:400 clamp(36px,11vw,58px)/1 var(--head);color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);transform:rotate(-2deg)}
.pr-overlay .chest{position:relative;width:auto;height:auto;max-width:min(62vw,280px);max-height:32vh;object-fit:contain;margin-top:8px;
  animation:pr-chestIn .8s cubic-bezier(.2,1.6,.4,1) both,pr-float 1.6s .8s ease-in-out infinite}
@keyframes pr-chestIn{from{transform:scale(0) rotate(-30deg)}}
@keyframes pr-float{50%{transform:translateY(-12px) rotate(3deg)}}
.pr-overlay .win-amt{position:relative;display:flex;align-items:center;gap:10px;font:400 clamp(52px,15vw,84px)/1 var(--head);color:var(--c1);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);font-variant-numeric:tabular-nums}
.pr-overlay .win-amt img{width:.85em}
.pr-coinfx{position:fixed;left:50%;top:50%;z-index:60;pointer-events:none;animation:pr-coinfx 1.4s cubic-bezier(.15,.7,.35,1) forwards}
@keyframes pr-coinfx{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:0}}

/* claim sheet */
.pr-modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.pr-modal.show{display:flex;animation:pr-fade .25s}
.pr-card{position:relative;width:100%;max-width:440px;max-height:100dvh;overflow:auto;text-align:center;padding:12px 20px calc(20px + var(--safe-b));
  border-radius:28px 28px 0 0;background:var(--paper);color:var(--ptext);border:4px solid var(--ink);border-bottom:0;animation:pr-sheet .45s cubic-bezier(.2,1.3,.4,1)}
.pr-card .grab{width:46px;height:6px;border-radius:9px;background:var(--ink);opacity:.25;margin:0 auto 14px}
@keyframes pr-sheet{from{transform:translateY(100%)}}
@media (min-width:600px) and (min-height:640px){
  .pr-modal{align-items:center;padding:20px}
  .pr-card{border-radius:26px;border-bottom:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);padding-bottom:24px;animation:pr-pop .45s cubic-bezier(.2,1.3,.4,1)}
  .pr-card .grab{display:none}
}
@keyframes pr-pop{from{transform:scale(.85);opacity:0}}
.pr-card h3{font:400 28px/1.05 var(--head);letter-spacing:.01em}
.pr-card p.sub{color:var(--pmuted);font-size:14.5px;margin-top:6px;line-height:1.4}
.pr-card .cta{margin-top:16px}
.prize{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 16px 5px;border-radius:999px;background:var(--c1);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--hard-sm);font:400 18px/1 var(--head);font-variant-numeric:tabular-nums}
.prize img{width:24px}
.field{margin-top:16px;text-align:left}
.field label{display:block;font-size:12px;font-weight:900;color:var(--pmuted);margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.06em}
.field .in{position:relative}
.field .in span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--pmuted);font:400 20px var(--head)}
.field input{width:100%;padding:14px 16px 14px 36px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:#14121a;box-shadow:inset 0 3px 0 rgba(0,0,0,.08);
  font:800 17px var(--body);outline:none;user-select:text;-webkit-user-select:text}
.field input:focus{box-shadow:0 0 0 4px var(--c1)}
.profile{margin-top:14px;min-height:84px;border-radius:18px;background:rgba(0,0,0,.05);border:3px dashed var(--ink);display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 14px;text-align:left}
.profile.filled{border-style:solid;background:#fff;color:#14121a;justify-content:flex-start;box-shadow:var(--hard-sm);animation:pr-pop .3s}
.ava{flex:none;width:60px;height:60px;border-radius:50%;padding:3px;background:var(--c2);border:3px solid var(--ink)}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#ddd;display:block}
.pinfo{min-width:0}
.pinfo .nick{font:400 19px/1.1 var(--head);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{width:18px;height:18px;border-radius:50%;background:#20d5ec;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none;border:2px solid var(--ink)}
.pinfo .meta{font-size:12.5px;color:#6b6878;margin-top:4px;font-weight:800}
.placeholder{font-size:13.5px;color:var(--pmuted);font-weight:800}
.spinner{width:26px;height:26px;border-radius:50%;border:4px solid rgba(0,0,0,.15);border-top-color:var(--c2);animation:pr-rot .6s linear infinite}
.progress{height:18px;border-radius:99px;background:rgba(0,0,0,.1);border:3px solid var(--ink);overflow:hidden;margin-top:18px}
.progress div{height:100%;width:0;background:var(--c1);transition:width .25s;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.steps{margin-top:14px;text-align:left;display:grid;gap:9px}
.step{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;opacity:.35;transition:opacity .3s}
.step .dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:#fff;color:#fff}
.step.active{opacity:1}
.step.active .dot{border-top-color:transparent;animation:pr-rot .6s linear infinite}
.step.done{opacity:1}
.step.done .dot{background:#22c55e}
.check{width:76px;height:76px;margin:2px auto 12px;border-radius:50%;background:#22c55e;border:4px solid var(--ink);box-shadow:var(--hard);display:flex;align-items:center;justify-content:center;animation:pr-popc .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pr-popc{from{transform:scale(0) rotate(-40deg)}}
.check svg{width:36px;height:36px}
.tx{margin-top:12px;font-size:11.5px;color:var(--pmuted);font-family:ui-monospace,Menlo,monospace}
.pr-confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;border:2px solid var(--ink);z-index:80;pointer-events:none;animation:pr-fall linear forwards}
@keyframes pr-fall{to{transform:translateY(110vh) rotate(760deg)}}

@media (max-height:640px){ .eyebrow{display:none} .strip{padding:6px 0} .ticker{display:none} .hero h1{margin-top:0} }

</style><title>Black Friday Coin Arcade</title>
<style>
html,body{overflow:auto;height:auto}
html{background:#5b21b6}
body{display:block;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#8b5cf6,#5b21b6 45%,#2e0b6b);background-attachment:fixed;color:#fff}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(rgba(255,210,63,.35) 2.4px,transparent 3px) 0 0/40px 40px,radial-gradient(rgba(255,79,154,.3) 2px,transparent 2.6px) 20px 20px/40px 40px}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:26px 16px 50px}
header{text-align:center;margin-bottom:22px}
.eb{display:inline-block;font:400 14px/1 "Lilita One",sans-serif;letter-spacing:.1em;color:#14121a;background:#ffd23f;padding:7px 12px 5px;border:3px solid #14121a;border-radius:10px;transform:rotate(-3deg);box-shadow:0 4px 0 #14121a}
h1{font:400 clamp(48px,14vw,86px)/.9 "Lilita One",sans-serif;margin-top:12px;color:#fff;-webkit-text-stroke:9px #14121a;paint-order:stroke fill;text-shadow:0 8px 0 #14121a}
h1 em{font-style:normal;color:#ffd23f;display:inline-block;transform:rotate(-4deg)}
header p{margin-top:14px;font-weight:900;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
h2{font:400 26px/1 "Lilita One",sans-serif;margin:30px 4px 14px;color:#ffd23f;-webkit-text-stroke:6px #14121a;paint-order:stroke fill;text-shadow:0 4px 0 #14121a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.g{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;border-radius:20px;text-decoration:none;color:#14121a;background:#fff;border:4px solid #14121a;box-shadow:0 6px 0 #14121a;transition:transform .12s,box-shadow .12s;overflow:hidden}
.g:hover{transform:translateY(-3px) rotate(-1deg)}
.g:active{transform:translateY(4px);box-shadow:0 2px 0 #14121a}
.g .ic{height:78px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--a);border:3px solid #14121a;position:relative;overflow:hidden}
.g .ic::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.6px) 0 0/12px 12px}
.g .ic span{position:relative;filter:drop-shadow(2px 0 0 #14121a) drop-shadow(-2px 0 0 #14121a) drop-shadow(0 2px 0 #14121a) drop-shadow(0 -2px 0 #14121a)}
.g b{font:400 19px/1 "Lilita One",sans-serif}
.g small{font-size:12.5px;font-weight:800;color:#5a5866;line-height:1.3}
.g .t{position:absolute;top:8px;right:8px;font:400 11px/1 "Lilita One",sans-serif;background:#14121a;color:#ffd23f;padding:4px 6px 3px;border-radius:7px;z-index:1}
.g.bonus .t{background:#ff4f9a;color:#fff}
footer{text-align:center;font-weight:900;font-size:12px;opacity:.7;margin-top:30px}
</style></head><body>
<div class="wrap">
  <header><div class="eb">BLACK FRIDAY · FREE COINS</div><h1>Coin <em>Arcade</em></h1><p>Pick a game — 10 seconds to win 10,000 coins!</p></header>
  <h2>Bonus picks</h2><div class="grid" id="bonus"></div>
  <h2>All games</h2><div class="grid" id="grid"></div>
  <footer>Black Friday Event · 2026</footer>
</div>
<script>
const BONUS=[
["coin-rain","🌧️","Coin Rain","Catch the falling coin shower","#7dd3fc"],
["coin-slash","⚔️","Coin Slash","Slice coins, dodge glitch bombs","#fe2c55"],
["spin-wheel","🎡","Spin & Win","One spin, mystery chest","#25f4ee"],
["black-friday-coins","🎰","Coin Drop Wheel","The original Black Friday wheel","#a78bfa"]];
const G=[
["01-piggy-smash","🐷","Piggy Smash","Smash the piggy bank","#ff9cc6"],
["02-scratch-card","🎟️","Scratch & Win","Match 3 chests","#2ec4b6"],
["03-gift-box","🎁","Mystery Gift","Rip the gift open","#8b5cf6"],
["06-balloon-pop","🎈","Balloon Pop","Find the golden balloon","#7dd3fc"],
["07-piano-tiles","🎹","Piano Rush","Coins flow while you play","#fe2c55"],
["08-coin-catch","🧺","Coin Catch","Wasteland loot rain","#fb923c"],
["09-coin-ninja","🥷","Coin Ninja","Slice flying coins","#ef4444"],
["11-tower-stack","🏗️","Tower Stack","Stack 8 floors","#facc15"],
["12-coin-runner","🏃","Coin Runner","Run, jump, smash","#ec4899"],
["13-flappy-coin","🐤","Flappy Coin","Flap through the gates","#4ade80"],
["17-maze-rush","👾","Maze Rush","Munch every coin","#38bdf8"],
["18-slot-machine","🎰","Mega Slots","3 free spins","#ef4444"],
["19-roulette","🎡","Lucky Roulette","Bet on your number","#16a34a"],
["20-plinko","🔻","Plinko Drop","Hit the 100× slot","#a855f7"],
["29-lottery","🎱","Lotto 6/49","Pick 6 & draw","#fde68a"],
["30-case-opening","📦","Loot Case","Unbox a legendary","#fde047"],
["34-luck-test","🍀","Luck Test","How lucky are you?","#86efac"],
["38-daily-calendar","📅","Gift Calendar","7 days in one","#ef4444"],
["39-treasure-map","🗺️","Treasure Map","Dig up the chest","#4fb3d9"],
["40-puzzle","🧩","Prize Puzzle","Piece it together","#f0abfc"],
["42-coin-farm","🌳","Coin Farm","Grow a money tree","#4ade80"]];
const card=(cls,tag)=>([f,ic,n,d,a])=>`<a class="g ${cls}" href="${f}.html" style="--a:${a}"><span class="t">${tag}</span><div class="ic"><span>${ic}</span></div><b>${n}</b><small>${d}</small></a>`;
document.getElementById("bonus").innerHTML=BONUS.map(card("bonus","NEW")).join("");
document.getElementById("grid").innerHTML=G.map(card("","10s")).join("");
</script></body></html>
